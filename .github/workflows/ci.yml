name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  veyzl-log:
    # Every commit tagged `VEYZL: V-###` must be logged in docs/veyzl.md (AGENTS.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - run: scripts/check-veyzl-log.sh origin/${{ github.base_ref }}

  veyzl-probes:
    # Replays VEYZL's API-audit probes against THIS PR's code through POST /api/agent.
    # VEYZL itself only audits the deployed Backend URL; this catches guardrail regressions before merge.
    # Add the ANTHROPIC_API_KEY repo secret to also run the model-backed probe (otherwise it is skipped).
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RUN_MODEL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Note when the model-backed probe is skipped
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY secret not set; skipping the model-backed probe (gen-fact-paris-001)."
      - run: npm run test:probes
