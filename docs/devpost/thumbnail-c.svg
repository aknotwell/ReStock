<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A3B2C"/>
      <stop offset="1" stop-color="#0F5A3F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1500" height="1000" fill="url(#bg)"/>
  <g opacity="0.07" fill="#FFFFFF">
    <circle cx="140" cy="900" r="240"/>
    <circle cx="1420" cy="80" r="180"/>
  </g>

  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- logo + wordmark -->
    <g transform="translate(110,120)">
      <path d="M0 21 a21 21 0 0 1 21 -21 h57 a21 21 0 0 1 21 21 v37 a21 21 0 0 1 -21 21 h-39 l-22 20 v-20 h-5 a12 12 0 0 1 -12 -12 z" fill="#5BE38B"/>
      <path d="M21 24 h9 l9 30 h33 l7 -22 h-43" fill="none" stroke="#0A3B2C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="44" cy="64" r="4.5" fill="#0A3B2C"/>
      <circle cx="69" cy="64" r="4.5" fill="#0A3B2C"/>
      <text x="122" y="64" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Restock</text>
    </g>

    <text font-size="84" font-weight="800" fill="#FFFFFF" letter-spacing="-2">
      <tspan x="110" y="390">Shop together.</tspan>
      <tspan x="110" dy="96" fill="#5BE38B">Split fairly.</tspan>
    </text>
    <text font-size="31" font-weight="500" fill="#CFE9DC">
      <tspan x="110" y="590">An AI assistant in your group chat.</tspan>
      <tspan x="110" dy="44">Shared items split evenly, personal items</tspan>
      <tspan x="110" dy="44">go to whoever wanted them, and every</tspan>
      <tspan x="110" dy="44">card pays its own share.</tspan>
    </text>

    <!-- receipt -->
    <g transform="translate(870,95) rotate(2)" filter="url(#shadow)">
      <path d="M0 0 h520 v800 l-26 16 l-26 -16 l-26 16 l-26 -16 l-26 16 l-26 -16 l-26 16 l-26 -16 l-26 16 l-26 -16 l-26 16 l-26 -16 l-26 16 l-26 -16 l-26 16 l-26 -16 l-26 16 l-26 -16 l-26 16 l-26 -16 l-26 16 z" fill="#FFFFFF"/>
      <text x="260" y="62" font-size="26" font-weight="800" fill="#0A3B2C" text-anchor="middle">Apt 4B · this week's order</text>
      <text x="260" y="94" font-size="18" fill="#7A8A82" text-anchor="middle">split rule: smart</text>
      <line x1="36" y1="118" x2="484" y2="118" stroke="#D5DDD8" stroke-dasharray="6 6"/>

      <g font-size="21" fill="#1E2B26">
        <text x="40" y="158">Toilet paper, 12 rolls</text><text x="480" y="158" text-anchor="end">$11.99</text>
        <text x="40" y="196">Dish soap, 3 pack</text><text x="480" y="196" text-anchor="end">$8.49</text>
        <text x="40" y="234">Paper towels, 6 rolls</text><text x="480" y="234" text-anchor="end">$9.99</text>
        <text x="40" y="272">Air fryer <tspan fill="#7A8A82" font-size="17">(Jake, approved by Sam)</tspan></text><text x="480" y="272" text-anchor="end">$32.00</text>
        <text x="40" y="310">Tortilla chips <tspan fill="#7A8A82" font-size="17">(Jake)</tspan></text><text x="480" y="310" text-anchor="end">$4.79</text>
        <text x="40" y="348">Oat milk <tspan fill="#7A8A82" font-size="17">(Sam)</tspan></text><text x="480" y="348" text-anchor="end">$5.49</text>
      </g>
      <line x1="36" y1="374" x2="484" y2="374" stroke="#D5DDD8" stroke-dasharray="6 6"/>
      <text x="40" y="414" font-size="24" font-weight="800" fill="#0A3B2C">Total</text>
      <text x="480" y="414" font-size="24" font-weight="800" fill="#0A3B2C" text-anchor="end">$72.75</text>

      <!-- shares -->
      <g font-size="22">
        <g transform="translate(40,460)">
          <rect width="440" height="88" rx="18" fill="#EEF8F2"/>
          <circle cx="44" cy="44" r="26" fill="#1FA855"/><text x="44" y="52" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">S</text>
          <text x="86" y="38" font-weight="700" fill="#1E2B26">Sam</text>
          <text x="86" y="66" font-size="17" fill="#5F6F68">Visa ending 4242</text>
          <text x="420" y="54" font-weight="800" fill="#0A3B2C" text-anchor="end">$15.65</text>
        </g>
        <g transform="translate(40,560)">
          <rect width="440" height="88" rx="18" fill="#EEF8F2"/>
          <circle cx="44" cy="44" r="26" fill="#2F6BFF"/><text x="44" y="52" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">J</text>
          <text x="86" y="38" font-weight="700" fill="#1E2B26">Jake</text>
          <text x="86" y="66" font-size="17" fill="#5F6F68">card ending 1881</text>
          <text x="420" y="54" font-weight="800" fill="#0A3B2C" text-anchor="end">$46.95</text>
        </g>
        <g transform="translate(40,660)">
          <rect width="440" height="88" rx="18" fill="#FFF4E0"/>
          <circle cx="44" cy="44" r="26" fill="#F2994A"/><text x="44" y="52" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">P</text>
          <text x="86" y="38" font-weight="700" fill="#1E2B26">Priya</text>
          <text x="86" y="66" font-size="17" fill="#8A6A3A">pay-back link sent privately</text>
          <text x="420" y="54" font-weight="800" fill="#0A3B2C" text-anchor="end">$10.15</text>
        </g>
      </g>
    </g>
  </g>
</svg>
