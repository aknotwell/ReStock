<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f3">
<title>Restock</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%23111'/%3E%3Cpath d='M19.64 16.05A6 6 0 1 1 18.6 10.14' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M18.34 7.15L18.6 10.14L15.7 9.36' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='11.5' y='11.5' width='5' height='5' rx='1.2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
  /* Warm monochrome. Color only means something: blue = personal, green = groups, red = money owed or over. */
  :root {
    color-scheme: light;
    --canvas: #f7f6f3;
    --surface: #ffffff;
    --ink: #2f3437;
    --black: #111111;
    --muted: #787774;
    --line: #eaeaea;
    --track: #efeee9;
    --green: #346538;
    --green-soft: #edf3ec;
    --blue: #1f6c9f;
    --blue-soft: #e1f3fe;
    --red: #9f2f2d;
    --red-soft: #fdebec;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  body { min-width: 320px; margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
  button, input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--black); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .shell { width: min(1120px, calc(100% - 48px)); margin: 0 auto; }

  .is-personal { --accent: var(--blue); --accent-soft: var(--blue-soft); }
  .is-group { --accent: var(--green); --accent-soft: var(--green-soft); }

  header { border-bottom: 1px solid var(--line); background: var(--surface); }
  .topbar { display: flex; height: 64px; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--black); font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .logo { width: 28px; height: 28px; color: var(--black); }
  .account { display: flex; align-items: center; gap: 14px; color: var(--muted); }
  .link-button { padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer; font-weight: 600; }
  .link-button:hover { color: var(--black); text-decoration: underline; }

  .btn { padding: 9px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 600; }
  .btn:hover { border-color: #d6d5d0; }
  .btn:active { transform: scale(.98); }
  .btn.primary { border-color: var(--black); background: var(--black); color: #fff; }
  .btn.primary:hover { background: #333; }
  .btn:disabled { cursor: default; opacity: .5; }

  /* Login */
  .login { display: grid; min-height: calc(100vh - 65px); place-items: center; padding: 24px 0; }
  .login-card { width: min(380px, 100%); padding: 32px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .login-card .logo { width: 40px; height: 40px; margin-bottom: 20px; }
  .login-card h1 { margin: 0 0 20px; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; color: var(--muted); font-size: 13px; }
  .field input { padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 16px; }
  .field input.code { letter-spacing: .4em; font-variant-numeric: tabular-nums; }
  .login-card .btn { width: 100%; padding: 12px; }
  .login-actions { display: flex; justify-content: space-between; margin-top: 14px; color: var(--muted); font-size: 13px; }
  .error { margin: 12px 0 0; color: var(--red); font-size: 13px; }

  /* App */
  main.app { padding: 36px 0 72px; }
  .workspace { display: grid; grid-template-columns: 180px minmax(0, 1fr); align-items: start; gap: 40px; }
  .sidebar { position: sticky; top: 24px; display: grid; gap: 4px; }
  .side-item { display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; font-size: 15px; font-weight: 600; }
  .side-item:hover { color: var(--ink); }
  .side-item[aria-current="page"] { border-color: var(--line); background: var(--surface); color: var(--black); }
  .side-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  .content { min-width: 0; }
  h1 { margin: 0 0 24px; color: var(--black); font-family: var(--serif); font-size: clamp(30px, 4vw, 40px); font-weight: 500; letter-spacing: -.03em; line-height: 1.1; }
  .back { margin-bottom: 16px; padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font-weight: 600; }
  .back:hover { color: var(--black); }

  .rows { display: grid; gap: 8px; }
  .space-row { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(160px, 2fr) 110px 12px; align-items: center; gap: 24px; width: 100%; padding: 18px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; text-align: left; transition: border-color .2s ease; }
  .space-row:hover { border-color: #d6d5d0; }
  .row-name { display: flex; min-width: 0; align-items: center; gap: 12px; color: var(--black); font-size: 15px; font-weight: 600; }
  .row-name b { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .mono { display: grid; flex: none; width: 36px; height: 36px; place-items: center; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-family: var(--serif); font-size: 18px; font-weight: 600; }
  .row-amount { text-align: right; color: var(--black); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .over { color: var(--red); }
  .chevron { color: var(--muted); }

  .bar { display: block; height: 8px; overflow: hidden; border-radius: 99px; background: var(--track); }
  .bar span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
  .bar.is-over span { background: var(--red); }

  .add-group { width: 100%; margin-top: 8px; padding: 16px 20px; border: 1px dashed #d6d5d0; border-radius: 12px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; font-weight: 600; }
  .add-group:hover { color: var(--black); border-color: var(--black); }
  .add-group-form { display: flex; flex-wrap: wrap; gap: 8px; max-width: 460px; margin-top: 8px; }
  .add-group-form input { flex: 1; min-width: 180px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }

  .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 16px; }
  .settings-column { display: grid; gap: 16px; min-width: 0; }
  .card { min-width: 0; padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .card h2 { margin: 0; color: var(--black); font-family: var(--serif); font-size: 20px; font-weight: 500; letter-spacing: -.01em; }
  .big { color: var(--black); font-family: var(--serif); font-size: 34px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .big small { margin-left: 6px; color: var(--muted); font-family: var(--sans); font-size: 14px; font-weight: 500; letter-spacing: 0; }
  .budget-body { display: grid; gap: 16px; }
  .budget-line { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
  .money-input { display: inline-flex; width: 120px; align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-weight: 600; }
  .money-input input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; font-variant-numeric: tabular-nums; }

  .line { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 48px; border-top: 1px solid var(--line); }
  .line:first-child { border-top: 0; }
  .line-label { color: var(--ink); font-weight: 500; }
  .line-value { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }
  .line.total .line-label, .line.total .line-value { color: var(--black); font-weight: 650; }
  .inline { display: flex; align-items: center; gap: 12px; }
  .line .money-input { width: 96px; padding: 6px 9px; }

  .switch { position: relative; flex: none; width: 36px; height: 20px; }
  .switch input { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .switch input:disabled { cursor: default; }
  .switch span { position: absolute; inset: 0; border-radius: 99px; background: #dcdbd6; transition: background .2s ease; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s ease; }
  .switch input:checked + span { background: var(--black); }
  .switch input:disabled + span { opacity: .45; }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--black); outline-offset: 2px; }

  .tag { padding: 3px 10px; border-radius: 99px; background: var(--track); color: var(--ink); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .tag.red { background: var(--red-soft); color: var(--red); }
  .tag.green { background: var(--green-soft); color: var(--green); }
  .segmented { display: inline-flex; gap: 2px; margin-bottom: 8px; padding: 3px; border-radius: 8px; background: var(--track); }
  .segmented button { padding: 6px 12px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 600; }
  .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--black); }

  @media (prefers-reduced-motion: no-preference) {
    .reveal { animation: rise .6s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  }


  @media (max-width: 820px) {
    .shell { width: calc(100% - 32px); }
    main.app { padding-top: 20px; }
    .workspace { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .sidebar { position: static; grid-template-columns: 1fr 1fr; }
    .settings-grid { grid-template-columns: minmax(0, 1fr); }
    .space-row { grid-template-columns: minmax(0, 1fr) auto 12px; gap: 14px; }
    .space-row .bar-slot { grid-column: 1 / -1; grid-row: 2; }
    .card { padding: 20px; }
  }
  #login-error.info { color: var(--muted); }
  .live-note { color: var(--muted, #6b7280); font-size: 14px; margin: 4px 0 12px; }
  body.is-live #add-group { display: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 28 28">
    <rect width="28" height="28" rx="7" fill="currentColor"/>
    <path d="M19.64 16.05A6 6 0 1 1 18.6 10.14" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M18.34 7.15L18.6 10.14L15.7 9.36" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="11.5" y="11.5" width="5" height="5" rx="1.2" fill="#fff"/>
  </symbol>
</svg>

<header>
  <div class="shell topbar">
    <div class="brand"><svg class="logo"><use href="#logo"/></svg>restock</div>
    <div class="account" id="account" hidden>
      <span id="account-name"></span>
      <button class="link-button" id="logout" type="button">Log out</button>
    </div>
  </div>
</header>

<main class="shell login" id="login-view">
  <div class="login-card">
    <svg class="logo"><use href="#logo"/></svg>
    <h1>Log in</h1>
    <form id="phone-form">
      <label class="field">Phone number<input id="login-phone" type="tel" autocomplete="tel" required></label>
      <button class="btn primary" type="submit">Text me a code</button>
    </form>
    <form id="code-form" hidden>
      <label class="field">Code<input class="code" id="login-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
      <button class="btn primary" type="submit">Log in</button>
      <div class="login-actions"><button class="link-button" id="login-back" type="button">Change number</button><button class="link-button" id="login-resend" type="button">Send again</button></div>
    </form>
    <p class="error" id="login-error" hidden></p>
  </div>
</main>

<main class="shell app workspace" id="app" hidden>
  <nav class="sidebar" aria-label="Personal or groups">
    <button class="side-item is-personal" id="nav-personal" type="button"><span class="side-dot" aria-hidden="true"></span>Personal</button>
    <button class="side-item is-group" id="nav-groups" type="button"><span class="side-dot" aria-hidden="true"></span>Groups</button>
  </nav>

  <div class="content" id="content">
    <section id="list-view">
      <h1 id="list-title">Groups</h1>
      <div class="rows" id="rows"></div>
      <div id="row-add">
        <button class="add-group" id="add-group" type="button">Add a group</button>
        <form class="add-group-form" id="add-group-form" hidden>
          <input id="new-group-name" type="text" maxlength="40" placeholder="Group name" aria-label="Group name" required>
          <button class="btn primary" type="submit">Create</button><button class="btn" id="cancel-group" type="button">Cancel</button>
        </form>
      </div>
    </section>

    <section id="detail-intro" hidden>
      <button class="back" id="back" type="button">← Groups</button>
      <h1 id="view-title">Maple House</h1>
    </section>

    <section id="space-view" hidden>
      <div class="settings-grid">
        <div class="settings-column">
          <section class="card reveal" aria-labelledby="pay-heading">
            <div class="card-head"><h2 id="pay-heading">Payments</h2></div>
            <div id="pay-list"></div>
          </section>
          <section class="card reveal" style="--i:1" aria-labelledby="budget-heading">
            <div class="card-head">
              <h2 id="budget-heading">Monthly budget</h2>
              <label class="switch"><input id="budget-toggle" type="checkbox" aria-label="Use a monthly budget"><span></span></label>
            </div>
            <div class="budget-body" id="budget-body"></div>
          </section>
        </div>
        <div class="settings-column">
          <section class="card reveal" style="--i:2" aria-labelledby="rules-heading">
            <div class="card-head"><h2 id="rules-heading">Rules</h2></div>
            <div class="line">
              <span class="line-label">Add everyday supplies</span>
              <label class="switch"><input id="routine-toggle" type="checkbox" aria-label="Add everyday supplies"><span></span></label>
            </div>
            <div class="line">
              <span class="line-label">Ask first over</span>
              <span class="inline">
                <label class="money-input" id="approval-amount">$<input id="approval-input" type="number" min="0" step="5" aria-label="Ask first over this many dollars"></label>
                <label class="switch"><input id="approval-toggle" type="checkbox" aria-label="Ask first over a price"><span></span></label>
              </span>
            </div>
            <div class="line">
              <span class="line-label">Order only after “order now”</span>
              <span class="tag">Always on</span>
            </div>
          </section>
          <section class="card reveal" style="--i:3" id="approvers-card" aria-labelledby="approvers-heading">
            <div class="card-head"><h2 id="approvers-heading">Who can approve</h2></div>
            <div class="segmented" id="approval-presets" role="group" aria-label="Who can approve">
              <button type="button" data-preset="everyone" aria-pressed="false">Everyone</button>
              <button type="button" data-preset="chosen" aria-pressed="false">Only who I pick</button>
            </div>
            <div id="approver-list"></div>
          </section>
          <section class="card reveal" style="--i:4" aria-labelledby="cart-heading">
            <div class="card-head"><h2 id="cart-heading">Cart</h2></div>
            <div id="cart-body"></div>
          </section>
        </div>
      </div>
    </section>

  </div>
</main>
<script>
  // Demo data. All money is integer cents, like the rest of Restock. budget: null = no monthly limit.
  const personal = {
    id: "personal", name: "Personal", budget: null, spent: 1847, threshold: 3000, askFirst: true, routine: true,
    card: null, members: [], debts: [],
    cart: [{ name: "Oat milk", cents: 549 }, { name: "Shampoo", cents: 899 }],
  };
  const groups = [
    {
      id: "maple", name: "Maple House", budget: 20000, spent: 5952, threshold: 2500, askFirst: true, routine: true,
      members: [{ name: "Sam", role: "owner", card: "4242", canApprove: true }, { name: "Jake", card: "1881", canApprove: true }, { name: "Priya", card: null, canApprove: true }],
      cart: [{ name: "Toilet paper, 12 rolls", cents: 1199 }, { name: "Dish soap, 3 pack", cents: 849 }],
      debts: [{ from: "Priya", cents: 1015 }],
    },
    {
      id: "family", name: "Garcia Family", budget: null, spent: 21000, threshold: 5000, askFirst: true, routine: true,
      members: [{ name: "Mom", role: "owner", card: null, canApprove: true }, { name: "Dad", card: "3220", canApprove: true }, { name: "Maya", kid: true, canApprove: false }, { name: "Leo", kid: true, canApprove: false }],
      cart: [{ name: "Laundry detergent, 64 loads", cents: 1499 }, { name: "Eggs, 18 ct", cents: 549 }],
      debts: [],
    },
    {
      id: "soccer", name: "Soccer Team", budget: 12000, spent: 12850, threshold: 4000, askFirst: true, routine: true,
      members: [{ name: "Alex", role: "owner", card: "4444", canApprove: true }, { name: "You", card: "1117", canApprove: true }, { name: "Jordan", card: null, canApprove: false }, { name: "Taylor", card: "0077", canApprove: false }],
      cart: [{ name: "Sports drinks", cents: 1400 }, { name: "First-aid tape", cents: 2000 }],
      debts: [{ from: "Jordan", cents: 3212 }],
    },
  ];

  const $ = (selector) => document.querySelector(selector);
  const make = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  };
  const dollars = (cents) => `$${Math.round(cents / 100).toLocaleString("en-US")}`;
  const formatCents = (cents) => `$${(cents / 100).toFixed(2)}`;
  const toCents = (value) => Math.max(0, Math.round((Number(value) || 0) * 100));
  const sum = (list, pick) => list.reduce((total, x) => total + pick(x), 0);
  const isOwner = (member) => member.role === "owner";
  const canApprove = (member) => isOwner(member) || member.canApprove === true;
  const hasBudget = (space) => space.budget !== null;
  const isOver = (space) => hasBudget(space) && space.spent > space.budget;
  function amountText(space) {
    if (!hasBudget(space)) return `${dollars(space.spent)} spent`;
    const left = space.budget - space.spent;
    return left < 0 ? `${dollars(-left)} over` : `${dollars(left)} left`;
  }

  function budgetBar(space) {
    const bar = make("span", `bar${isOver(space) ? " is-over" : ""}`);
    bar.setAttribute("role", "img");
    bar.setAttribute("aria-label", `${dollars(space.spent)} of ${dollars(space.budget)} spent`);
    const fill = make("span");
    fill.style.width = `${space.budget ? Math.min(100, space.spent / space.budget * 100) : 100}%`;
    bar.append(fill);
    return bar;
  }

  // ---------- Login: the same texted-code login as the pay-back site (/pay/api/*) ----------
  // Logged in, the dashboard shows your real household from /app/api/state (read-only; you manage it by text).
  // The sample households above are only used when the page is opened without a Restock server behind it.
  let live = null;
  let phone = "";

  function loginError(message, info = false) {
    $("#login-error").textContent = message || "";
    $("#login-error").hidden = !message;
    $("#login-error").classList.toggle("info", info);
  }

  async function api(path, body) {
    const response = await fetch(path, body
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), credentials: "same-origin" }
      : { credentials: "same-origin", cache: "no-store" });
    const data = await response.json().catch(() => null);
    return { ok: response.ok, status: response.status, data };
  }

  function enterApp(name) {
    $("#login-view").hidden = true;
    $("#app").hidden = false;
    $("#account").hidden = false;
    $("#account-name").textContent = name;
    showList("group");
  }

  function showLogin() {
    $("#app").hidden = true;
    $("#account").hidden = true;
    $("#login-view").hidden = false;
    $("#code-form").hidden = true;
    $("#phone-form").hidden = false;
  }

  // Map the live household into the same shape the sample data uses, so every view renders it unchanged.
  function applyLive(state) {
    live = state;
    const meCard = state.me.cardLast4;
    const cardOf = (m) => (m.isMe ? meCard : m.hasCard ? "on file" : null);
    const group = {
      id: "live", name: state.household.name, budget: state.household.budgetCents, spent: state.household.spentCents,
      threshold: state.household.approvalOverCents ?? 2500, askFirst: state.household.approvalOverCents != null, routine: true,
      members: state.members.map((m) => ({ name: m.name, role: m.role, card: cardOf(m), canApprove: m.role === "owner", isMe: m.isMe })),
      cart: state.items.map((i) => ({ name: i.shared ? i.name : `${i.name} (${i.addedBy})`, cents: i.cents })),
      debts: state.openDebts.map((d) => ({ from: d.from, cents: d.cents })),
    };
    groups.splice(0, groups.length, group);
    personal.card = meCard;
    personal.spent = 0;
    personal.cart = state.items.filter((i) => !i.shared && i.addedBy === state.me.name).map((i) => ({ name: i.name, cents: i.cents }));
    document.body.classList.add("is-live");
  }

  async function loadLive() {
    const { ok, status, data } = await api("/app/api/state");
    if (ok && data) {
      applyLive(data);
      return "live";
    }
    return status === 401 ? "login" : "error";
  }

  async function refreshLive() {
    if (!live || $("#app").hidden) return;
    const result = await loadLive().catch(() => "error");
    if (result === "login") return showLogin();
    if (result !== "live") return;
    if (!$("#space-view").hidden && selectedId) renderSpace();
    else if (!$("#list-view").hidden) showList(listKind);
  }

  $("#phone-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    phone = $("#login-phone").value.trim();
    if (phone.replace(/\D/g, "").length < 10) return loginError("Enter a 10-digit phone number.");
    loginError("");
    await api("/pay/api/start", { handle: phone }).catch(() => {});
    $("#phone-form").hidden = true;
    $("#code-form").hidden = false;
    $("#login-code").value = "";
    $("#login-code").focus();
    loginError("If that number is in a household, Restock just texted it a code. (You need to have texted Restock at least once.)", true);
  });
  $("#code-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const code = $("#login-code").value.trim();
    if (!/^\d{6}$/.test(code)) return loginError("Enter the 6-digit code.");
    const verify = await api("/pay/api/verify", { handle: phone, code }).catch(() => ({ ok: false, data: null }));
    if (!verify.ok) return loginError(verify.data?.error || "That code didn't work. Try again.");
    loginError("");
    if ((await loadLive()) !== "live") return loginError("Logged in, but your household couldn't be loaded. Refresh to try again.");
    enterApp(live.me.name);
  });
  $("#login-back").addEventListener("click", () => {
    $("#code-form").hidden = true;
    $("#phone-form").hidden = false;
    loginError("");
  });
  $("#login-resend").addEventListener("click", async () => {
    await api("/pay/api/start", { handle: phone }).catch(() => {});
    loginError("Sent a new code.", true);
  });
  $("#logout").addEventListener("click", async () => {
    await api("/pay/api/logout", {}).catch(() => {});
    location.reload();
  });
  setInterval(refreshLive, 10000);

  // ---------- List ----------
  let listKind = "group";
  let selectedId = null;
  const content = $("#content");
  const navPersonal = $("#nav-personal");
  const navGroups = $("#nav-groups");
  const spaceById = (id) => (id === "personal" ? personal : groups.find((g) => g.id === id));
  const sideOf = (space) => (space === personal ? "personal" : "group");

  function markNav(kind) {
    navPersonal.setAttribute("aria-current", kind === "personal" ? "page" : "false");
    navGroups.setAttribute("aria-current", kind === "group" ? "page" : "false");
  }

  function renderRows() {
    const rows = $("#rows");
    rows.replaceChildren();
    (listKind === "personal" ? [personal] : groups).forEach((space, i) => {
      const row = make("button", `space-row reveal ${space === personal ? "is-personal" : "is-group"}`);
      row.style.setProperty("--i", i);
      row.type = "button";
      row.setAttribute("aria-label", `${space.name}, ${amountText(space)}`);
      row.addEventListener("click", () => openSpace(space.id));
      const name = make("span", "row-name");
      const mono = make("span", "mono", space.name.slice(0, 1));
      mono.setAttribute("aria-hidden", "true");
      name.append(mono, make("b", null, space.name));
      const slot = make("span", "bar-slot");
      if (hasBudget(space)) slot.append(budgetBar(space));
      const amount = make("span", `row-amount${isOver(space) ? " over" : ""}`, amountText(space));
      const chevron = make("span", "chevron", "›");
      chevron.setAttribute("aria-hidden", "true");
      row.append(name, slot, amount, chevron);
      rows.append(row);
    });
  }

  function show(view) {
    $("#list-view").hidden = view !== "list";
    $("#detail-intro").hidden = view === "list";
    $("#space-view").hidden = view !== "space";
    window.scrollTo(0, 0);
  }

  function showList(kind) {
    listKind = kind;
    selectedId = null;
    content.className = `content ${kind === "personal" ? "is-personal" : "is-group"}`;
    markNav(kind);
    $("#list-title").textContent = kind === "personal" ? "Personal" : "Groups";
    $("#row-add").hidden = kind === "personal";
    renderRows();
    show("list");
  }

  // ---------- One space ----------
  const approvalInput = $("#approval-input");
  const approvalToggle = $("#approval-toggle");
  const routineToggle = $("#routine-toggle");
  const budgetToggle = $("#budget-toggle");

  function renderBudget(space) {
    budgetToggle.checked = hasBudget(space);
    const body = $("#budget-body");
    body.replaceChildren();
    if (!hasBudget(space)) {
      const big = make("div", "big", dollars(space.spent));
      big.append(make("small", null, "spent this month"));
      body.append(big);
      return;
    }
    const line = make("div", "budget-line");
    const big = make("div", `big${isOver(space) ? " over" : ""}`, amountText(space));
    big.append(make("small", null, `of ${dollars(space.budget)}`));
    const box = make("label", "money-input", "$");
    const input = make("input");
    input.id = "budget-input";
    input.type = "number";
    input.min = "0";
    input.step = "10";
    input.value = space.budget / 100;
    input.setAttribute("aria-label", "Monthly budget in dollars");
    input.addEventListener("input", () => {
      space.budget = toCents(input.value);
      big.replaceChildren(amountText(space), make("small", null, `of ${dollars(space.budget)}`));
      big.className = `big${isOver(space) ? " over" : ""}`;
      body.lastChild.replaceWith(budgetBar(space));
    });
    box.append(input);
    line.append(big, box);
    body.append(line, budgetBar(space));
  }

  function renderRules(space) {
    routineToggle.checked = space.routine;
    approvalToggle.checked = space.askFirst;
    approvalInput.value = space.threshold / 100;
    $("#approval-amount").style.visibility = space.askFirst ? "visible" : "hidden";
  }

  function line(label, right) {
    const row = make("div", "line");
    row.append(make("span", "line-label", label), right);
    return row;
  }

  function renderApprovers(group) {
    const everyone = group.members.every(canApprove);
    for (const b of document.querySelectorAll("#approval-presets button")) {
      b.setAttribute("aria-pressed", String(b.dataset.preset === (everyone ? "everyone" : "chosen")));
    }
    const list = $("#approver-list");
    list.replaceChildren();
    for (const member of group.members) {
      const sw = make("label", "switch");
      const input = make("input");
      input.type = "checkbox";
      input.checked = canApprove(member);
      input.disabled = isOwner(member);
      input.setAttribute("aria-label", `${member.name} can approve`);
      input.addEventListener("change", () => {
        member.canApprove = input.checked;
        renderApprovers(group);
      });
      sw.append(input, make("span"));
      list.append(line(member.name, sw));
    }
  }
  for (const b of document.querySelectorAll("#approval-presets button")) {
    b.addEventListener("click", () => {
      const group = spaceById(selectedId);
      for (const member of group.members) if (!isOwner(member)) member.canApprove = b.dataset.preset === "everyone";
      renderApprovers(group);
    });
  }

  // Fake for now, like the login. TODO: open the member's Stripe add-card page (createCardSetupLink).
  function setUpCard(holder, rerender) {
    holder.card = "4242";
    rerender();
  }

  // The main card pays for every order. Everyone else pays it back: automatically from a card
  // on file, or on the pay-back site.
  function renderPayments(space) {
    const list = $("#pay-list");
    list.replaceChildren();
    const isPersonal = space === personal;
    const holder = isPersonal ? space : space.members.find(isOwner);
    const label = isPersonal ? "Your card" : `Main card · ${holder.name}`;
    if (holder.card) {
      list.append(line(label, make("span", "line-value", `Visa ${holder.card}`)));
    } else {
      if (live) {
        list.append(line(label, make("span", "tag red", isPersonal || holder.isMe ? 'Text "add card" to Restock' : "No card yet")));
      } else {
        const button = make("button", "btn primary", isPersonal ? "Set up card" : "Set up main card");
        button.type = "button";
        button.addEventListener("click", () => setUpCard(holder, () => renderPayments(space)));
        list.append(line(label, button));
      }
    }
    if (isPersonal) return;
    for (const member of space.members) {
      if (isOwner(member)) continue;
      const owed = sum(space.debts.filter((d) => d.from === member.name), (d) => d.cents);
      const [text, kind] = member.kid ? ["Covered", ""]
        : owed > 0 ? [`Owes ${formatCents(owed)}`, "red"]
        : member.card ? [`Auto · ${member.card}`, "green"]
        : ["No card", "red"];
      list.append(line(member.name, make("span", `tag ${kind}`, text)));
    }
  }

  function renderCart(space) {
    const body = $("#cart-body");
    body.replaceChildren();
    if (space.cart.length === 0) return void body.append(line("Empty", make("span")));
    for (const item of space.cart) body.append(line(item.name, make("span", "line-value", formatCents(item.cents))));
    const total = line("Total", make("span", "line-value", formatCents(sum(space.cart, (i) => i.cents))));
    total.classList.add("total");
    body.append(total);
  }

  function renderSpace() {
    const space = spaceById(selectedId);
    let note = $("#live-note");
    if (live && !note) {
      note = make("p", "live-note", "Live view of your household. To change anything, text Restock: add items, \"order now\", \"add member …\".");
      note.id = "live-note";
      $("#view-title").after(note);
    }
    const isPersonal = space === personal;
    $("#view-title").textContent = space.name;
    $("#approvers-card").hidden = isPersonal;
    renderPayments(space);
    renderBudget(space);
    renderRules(space);
    if (!isPersonal) renderApprovers(space);
    renderCart(space);
    // Live view is read-only: lock every control once everything is rendered (you manage it by text).
    for (const control of document.querySelectorAll("#space-view input, #space-view button, #add-group")) control.disabled = !!live;
  }

  function openSpace(id) {
    selectedId = id;
    const side = sideOf(spaceById(id));
    listKind = side;
    content.className = `content ${side === "personal" ? "is-personal" : "is-group"}`;
    markNav(side);
    $("#back").textContent = side === "personal" ? "← Personal" : "← Groups";
    renderSpace();
    show("space");
  }

  navPersonal.addEventListener("click", () => showList("personal"));
  navGroups.addEventListener("click", () => showList("group"));
  $("#back").addEventListener("click", () => showList(listKind));
  budgetToggle.addEventListener("change", () => {
    const space = spaceById(selectedId);
    if (!budgetToggle.checked) space.lastBudget = space.budget;
    space.budget = budgetToggle.checked ? (space.lastBudget ?? 20000) : null;
    renderBudget(space);
  });
  approvalInput.addEventListener("input", () => { spaceById(selectedId).threshold = toCents(approvalInput.value); });
  approvalToggle.addEventListener("change", () => {
    const space = spaceById(selectedId);
    space.askFirst = approvalToggle.checked;
    renderRules(space);
  });
  routineToggle.addEventListener("change", () => { spaceById(selectedId).routine = routineToggle.checked; });

  const addGroupButton = $("#add-group");
  const addGroupForm = $("#add-group-form");
  const newGroupName = $("#new-group-name");
  addGroupButton.addEventListener("click", () => {
    addGroupButton.hidden = true;
    addGroupForm.hidden = false;
    newGroupName.focus();
  });
  $("#cancel-group").addEventListener("click", () => {
    addGroupForm.hidden = true;
    addGroupButton.hidden = false;
  });
  addGroupForm.addEventListener("submit", (event) => {
    event.preventDefault();
    const name = newGroupName.value.trim();
    if (!name) return newGroupName.focus();
    const group = { id: `group-${Date.now()}`, name, budget: null, spent: 0, threshold: 2500, askFirst: true, routine: true, members: [{ name: $("#account-name").textContent || "You", role: "owner", card: null, canApprove: true }], cart: [], debts: [] };
    groups.push(group);
    addGroupForm.reset();
    addGroupForm.hidden = true;
    addGroupButton.hidden = false;
    openSpace(group.id);
  });

  // ---------- Start: live data if logged in, the login screen if not ----------
  loadLive().then((result) => {
    if (result === "live") enterApp(live.me.name);
    else if (result === "login") showLogin();
    else loginError("Couldn't reach Restock. Showing sample data.") || enterApp("Sample");
  }).catch(() => enterApp("Sample"));
</script>
</body>
</html>
